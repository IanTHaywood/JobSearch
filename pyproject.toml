[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.8,<5",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
